name: Presentation Core

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate UI JSON catalogs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('content/de/ui').glob('*.json')):
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          PY
      - name: Compile presentation boundary
        run: |
          PYTHONPATH=src python3 -m compileall -q \
            src/bunkerfrequenz/presentation \
            src/bunkerfrequenz/application/presentation_capabilities.py \
            src/bunkerfrequenz/application/presentation_events.py \
            src/bunkerfrequenz/application/command_dispatcher.py
      - name: Presentation tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/presentation -v
