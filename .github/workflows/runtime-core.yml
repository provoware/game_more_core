name: Runtime Core

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: PYTHONPATH=src python3 -m compileall -q src
      - name: Runtime tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/runtime -v
