name: Runtime Core

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/runtime/**'
      - 'manifests/RUNTIME_MANIFEST.json'
      - 'manifests/TRAIT_ENGINE_MANIFEST.json'
      - 'manifests/JOURNAL_MANIFEST.json'
      - 'manifests/PROGRESSION_MANIFEST.json'
      - 'schemas/character_state.schema.json'
      - '.github/workflows/runtime-core.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/runtime/**'
      - 'manifests/RUNTIME_MANIFEST.json'
      - 'manifests/TRAIT_ENGINE_MANIFEST.json'
      - 'manifests/JOURNAL_MANIFEST.json'
      - 'manifests/PROGRESSION_MANIFEST.json'
      - 'schemas/character_state.schema.json'
      - '.github/workflows/runtime-core.yml'

jobs:
  runtime-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: PYTHONPATH=src python3 -m compileall -q src
      - name: Runtime tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/runtime -v
