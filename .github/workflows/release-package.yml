name: Release Package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible package twice and smoke unpacked runtime
        run: PYTHONPATH=src:. python3 -m unittest tests.runtime.test_release_package -v
      - name: Validate release-autopilot policy and evidence-chain contracts
        run: PYTHONPATH=src:. python3 -m unittest tests.release.test_release_autopilot tests.release.test_release_evidence_chain_pro -v
      - name: Restore clean evidence source workspace
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run Failure Containment PRO twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH=src:. python3 tools/failure_containment_pro.py --output-dir failure-containment-dist
          cat failure-containment-dist/FAILURE_CONTAINMENT_EVIDENCE.json.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BUNKERFREQUENZ-failure-containment-evidence
          path: |
            failure-containment-dist/FAILURE_CONTAINMENT_EVIDENCE.json
            failure-containment-dist/FAILURE_CONTAINMENT_EVIDENCE.json.sha256
            failure-containment-dist/SUBGATE_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run Desktop Browser E2E PRO twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          rm -rf desktop-browser-e2e-dist
          PYTHONPATH=src:. python3 tools/desktop_browser_e2e_pro.py \
            --prior-subgate failure-containment-dist/SUBGATE_EVIDENCE.json \
            --output-dir desktop-browser-e2e-dist
          cat desktop-browser-e2e-dist/DESKTOP_BROWSER_E2E_EVIDENCE.json.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BUNKERFREQUENZ-desktop-browser-e2e-evidence
          path: |
            desktop-browser-e2e-dist/DESKTOP_BROWSER_E2E_EVIDENCE.json
            desktop-browser-e2e-dist/DESKTOP_BROWSER_E2E_EVIDENCE.json.sha256
            desktop-browser-e2e-dist/SUBGATE_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run Release Autopilot PRO
        id: autopilot
        shell: bash
        run: |
          rm -rf autopilot-dist
          python3 tools/release_autopilot.py \
            --output-dir autopilot-dist \
            --subgate-evidence desktop-browser-e2e-dist/SUBGATE_EVIDENCE.json \
            --allow-quarantine
          state="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('autopilot-dist/evidence/RELEASE_EVIDENCE.json').read_text(encoding='utf-8'))
          print(data['release_state'])
          PY
          )"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Release Autopilot state: $state"
          if [ "$state" = "RELEASE_READY" ]; then
            test -n "$(find autopilot-dist/release -maxdepth 1 -name '*.zip' -print -quit)"
          else
            if [ -d autopilot-dist/release ] && find autopilot-dist/release -maxdepth 1 -name '*.zip' -print -quit | grep -q .; then
              echo "Nicht-READY-Zustand darf kein Benutzer-ZIP enthalten." >&2
              exit 1
            fi
          fi
      - name: Run Release Evidence Chain PRO
        if: steps.autopilot.outputs.state == 'RELEASE_READY'
        shell: bash
        run: |
          promoted="$(find autopilot-dist/release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$promoted"
          python3 tools/release_evidence_chain_pro.py \
            --failure-evidence failure-containment-dist/FAILURE_CONTAINMENT_EVIDENCE.json \
            --browser-evidence desktop-browser-e2e-dist/DESKTOP_BROWSER_E2E_EVIDENCE.json \
            --release-evidence autopilot-dist/evidence/RELEASE_EVIDENCE.json \
            --promoted-zip "$promoted" \
            --output-dir autopilot-dist/evidence-chain
          cat autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json.sha256
      - name: Show Evidence Root
        if: always()
        shell: bash
        run: |
          if [ -f autopilot-dist/evidence/RELEASE_EVIDENCE.json ]; then
            cat autopilot-dist/evidence/RELEASE_EVIDENCE.json
          fi
          if [ -f autopilot-dist/evidence/RELEASE_EVIDENCE.json.sha256 ]; then
            cat autopilot-dist/evidence/RELEASE_EVIDENCE.json.sha256
          fi
          if [ -f autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json ]; then
            cat autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json
          fi
          if [ -f autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json.sha256 ]; then
            cat autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BUNKERFREQUENZ-release-evidence
          path: |
            autopilot-dist/evidence/RELEASE_EVIDENCE.json
            autopilot-dist/evidence/RELEASE_EVIDENCE.json.sha256
            autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json
            autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json.sha256
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.autopilot.outputs.state == 'RELEASE_READY'
        with:
          name: BUNKERFREQUENZ-0.8.4-alpha.1
          path: |
            autopilot-dist/release/BUNKERFREQUENZ-0.8.4-alpha.1.zip
            autopilot-dist/release/BUNKERFREQUENZ-0.8.4-alpha.1.zip.sha256
            autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json
            autopilot-dist/evidence-chain/RELEASE_EVIDENCE_CHAIN.json.sha256
          if-no-files-found: error
          retention-days: 30
