name: Release Package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible package twice and smoke unpacked runtime
        run: PYTHONPATH=src:. python3 -m unittest tests.runtime.test_release_package -v
      - name: Build release artifact
        run: python3 tools/build_release.py --output-dir dist
      - name: Record artifact checksums
        run: |
          cat dist/*.sha256
          sha256sum dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BUNKERFREQUENZ-0.8.4-alpha.1
          path: |
            dist/BUNKERFREQUENZ-0.8.4-alpha.1.zip
            dist/BUNKERFREQUENZ-0.8.4-alpha.1.zip.sha256
          if-no-files-found: error
          retention-days: 30
